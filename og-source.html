<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Monsieur+La+Doulaise&family=Miss+Fajardose&family=Pochaevsk&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Cormorant Garamond', serif; }
  .card {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #f9f0df;
    background-image: url('og-frame-temp.jpg');
    background-size: cover;
    background-position: center;
    overflow: hidden;
  }
  .tint {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(120% 90% at 15% 10%, rgba(168, 70, 90, 0.5), transparent 55%),
      radial-gradient(110% 90% at 85% 0%, rgba(107, 122, 160, 0.55), transparent 60%),
      radial-gradient(140% 100% at 50% 100%, rgba(217, 138, 138, 0.5), transparent 65%),
      linear-gradient(160deg, rgba(107, 122, 160, 0.45) 0%, rgba(168, 101, 124, 0.45) 45%, rgba(217, 165, 138, 0.45) 100%);
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.10) 0, transparent 3%),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,0.08) 0, transparent 4%),
      radial-gradient(circle at 40% 80%, rgba(255,255,255,0.08) 0, transparent 3%),
      radial-gradient(circle at 85% 20%, rgba(255,255,255,0.10) 0, transparent 3%);
    pointer-events: none;
  }
  .inner { position: relative; z-index: 3; max-width: 1000px; padding: 0 40px; }
  .eyebrow {
    font-family: 'Pochaevsk', serif;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 22px;
    margin: 0 0 28px;
    padding-bottom: 22px;
    border-bottom: 2px solid rgba(249,240,223,0.6);
    display: inline-block;
  }
  .names {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px 8px;
    line-height: 1;
  }
  .names .name { font-family: 'Monsieur La Doulaise', cursive; font-size: 150px; font-weight: 400; }
  .names .amp { font-family: 'Miss Fajardose', cursive; font-size: 90px; transform: translateY(10px); }
  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 26px;
    margin: 34px 0 0;
    padding-top: 24px;
    border-top: 2px solid rgba(249,240,223,0.6);
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tint"></div>
    <div class="inner">
      <p class="eyebrow">Nos casamos</p>
      <h1 class="names">
        <span class="name">Juli</span><span class="amp">y</span><span class="name">Hernán</span>
      </h1>
      <p class="subtitle">Sábado 26 de Diciembre de 2026</p>
    </div>
  </div>
</body>
</html>
